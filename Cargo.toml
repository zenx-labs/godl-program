[workspace]
resolver = "2"
members = ["api", "program", "cli"]

[workspace.package]
version = "3.1.0"
edition = "2021"
homepage = "https://godl.supply"
description = "Solana native store of value."
readme = "./README.md"
keywords = ["solana"]

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22.1"
bincode = "1.3.3"
bytemuck = "1.14.3"
bytemuck_derive = "1.7.0"
const-crypto = "0.1.0"
dotenvy = "0.15"
entropy-api = { git = "https://github.com/zenx-labs/entropy-program.git", rev = "65713b41d81baff99d2e0a76d25727f624a23cc1" }
entropy-types = "0.0.1"
mpl-core = "0.11"
mpl-token-metadata = "5.1"
rmp = ">=0.8, <0.8.15"
rmp-serde = ">=1.0, <1.3.1"
num_enum = "0.7.2"
godl-api = { path = "./api" }
godl-mint-api = { git = "https://github.com/zenx-labs/godl-mint.git", rev = "184fd4635e5a35cc3d587651154346f11d9bfb41" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-account-decoder = "^2.1"
solana-address-lookup-table-interface = { version = "=0.0.2", features = ["bincode"] }
solana-nostd-keccak = "0.1.3"
solana-program = "^2.1"
solana-client = "^2.1"
solana-sdk = "^2.1"
spl-pod = "=0.5.1"
spl-token = { version = "^4", features = ["no-entrypoint"] }
spl-token-2022 = "^7"
spl-token-metadata-interface = "^0.6"
spl-associated-token-account = { version = "^6", features = [ "no-entrypoint" ] } 
steel = { features = ["spl"], version = "4.0.3" }
thiserror = "1.0.57"
tokio = { version = "1.37.0", features = ["full"] }

[profile.release]
overflow-checks = true

[profile.dev]
overflow-checks = true